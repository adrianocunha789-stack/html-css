<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em Html 5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>
        Tente abrir esse site em diferentes dispositivos ou simplismente aumente e diminua seu navegador.
    </p>
    <picture>
        <source media="(max-width: 750px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexivel">
    </picture>
    <h1> Reproduzindo audio </h1>
    <p>
        Vamos reprooduzir audios em html 5
    </p>
    <audio src="midia/happy-mistake.mp3" controls autoplay>

    </audio>

    <p>
        <audio preload="metadata" controls autoplay >
            <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        </audio>
    </p>
    
</body>
</html>
