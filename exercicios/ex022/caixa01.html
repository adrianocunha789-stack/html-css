<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixa</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
    }
    h1{
        background-color: lightgray;
        height: 300px;
        width: 300px;
        
        border: 10px solid darkslategray;
        margin: 20px 20px 40px 20px;
        padding: 10px 10px 10px 10px;
        outline: 5px solid salmon;
        
    }

    a{
        
        border: 1px solid red;
        
        

    }

</style>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragrafos também são exemplos de box-level, mas os <a href="#"> links são exemplos de caixa inline-level</a>.Vamos ver como tudo isso funciona.</p>
    
</body>
</html>
